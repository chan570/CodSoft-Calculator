<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chan's Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="header">
        <h1>BASIC CALCULATOR</h1>
    </div>
    <div class="box">
        <div class="display">
                0
        </div>
        <div class="row">
            <button class="btn grey" onclick="cleardisplay()">AC</button>
            <button class="btn grey" onclick="delchar()">del</button>
            <button class="btn grey" onclick="press('%')">%</button>
            <button class="btn orange" onclick="press('/')">/</button>
          </div>
          <div class="row">
            <button class="btn" onclick="press('7')">7</button>
            <button class="btn" onclick="press('8')">8</button>
            <button class="btn" onclick="press('9')">9</button>
            <button class="btn orange mul" onclick="press('*')">*</button>
          </div>
          <div class="row">
            <button class="btn" onclick="press('4')">4</button>
            <button class="btn" onclick="press('5')">5</button>
            <button class="btn" onclick="press('6')">6</button>
            <button class="btn orange" onclick="press('-')">-</button>
          </div>
          <div class="row">
            <button class="btn" onclick="press('1')">1</button>
            <button class="btn" onclick="press('2')">2</button>
            <button class="btn" onclick="press('3')">3</button>
            <button class="btn orange" onclick="press('+')">+</button>
          </div>
          <div class="row">
            <button class="btn zero" onclick="press('0')">0</button>
            <button class="btn" onclick="press('.')">.</button>
            <button class="btn orange" onclick="calculate()">=</button>
          </div>
    </div>
    
</body>
</html>
